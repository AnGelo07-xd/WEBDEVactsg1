<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </div>
    <div class="container">
        <div class="sidebar">
            <h3>Menu</h3>
            <button>Dashboard</button>
            <button>Posts</button>
            <button>Settings</button>
            <button>Logout</button>
        </div>
        <div class="content">
            <div class="card">
                <img src="images/nature.jpg" alt="Nature">
                <h3>Beautiful Nature</h3>
                <p>Experience the beauty of nature and the outdoors.</p>
            </div>
            <div class="card">
                <img src="images/technology.jpg" alt="Technology">
                <h3>Modern Technology</h3>
                <p>Explore the latest advancements in technology.</p>

            </div>
            <div class="card">
                <img src="images/architecture.jpg" alt="Architecture">
                <h3>Amazing Architecture</h3>
                <p>Discover stunning architectural design.</p>
            </div>
        </div>
    </div>
</div>
</body>
<footer>
    &copy; 2025 Modern Layout - All Rights Reserved
</footer>  
</html>
