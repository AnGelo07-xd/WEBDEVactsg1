<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Calculator</h1>
        <div>
            <input type="number" id="operand1" placeholder="first number">
            <input type="number" id="operand2" placeholder="second number">
        </div>
        <div>
            <button oneclick="compute('+')" id="add">+</button>
            <button oneclick="compute('-')" id="subtract">-</button>
            <button oneclick="compute('*')" id="multiply">x</button>
            <button oneclick="compute('/')" id= "divide">&divide;</button>

        </div>
        
        <div>
            <span id="result"></span>
        </div>
    </main>
</body>
</html>
